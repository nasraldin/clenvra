# Format lint, ClenvraKit tests and a Release build on every push and pull request.
#
# UI tests (navigation in English/Arabic × light/dark, accessibility audit) are NOT run here: they need a logged-in
# GUI session with Accessibility/Automation permission for the test runner, which hosted runners do not provide.
# Run them locally with `scripts/check.sh --ui`.
#
# CI runs scripts/check.sh, the same gates as every Mac. It has no team certificate, so check.sh signs ad hoc.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, build
    # The project needs Xcode 27 (macOS 27 SDK, Swift 6.4). The macos-26 image stops at Xcode 26.6.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 27
        run: |
          # Newest released Xcode 27 on the image; release candidates and betas are skipped.
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_27*.app' ! -iname '*candidate*' ! -iname '*beta*' | sort -V | tail -n 1)"
          if [[ -z "$xcode" ]]; then
            echo "::error::No released Xcode 27 found on this runner"
            find /Applications -maxdepth 1 -name 'Xcode*.app'
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          sw_vers

      - name: Format, package tests, Release build
        run: scripts/check.sh

      - name: Keep test results when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: .build/DerivedData/Logs/Test/*.xcresult
          retention-days: 7
